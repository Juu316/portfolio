# Builds the Astro site, tests the production build, and deploys it to
# GitHub Pages. A failing type check, formatting check or Playwright test
# (broken link, accessibility violation, console error, overflow) stops the
# deploy, so a regression never reaches the live site.
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
  # Daily rebuild so the GitHub activity calendar stays current.
  schedule:
    - cron: "0 3 * * *"
  # Lets you re-deploy by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, but let an in-flight one finish.
concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types and formatting
        run: |
          pnpm run check
          pnpm run lint

      - name: Build site
        run: pnpm run build
        env:
          # Read-only use: the GitHub section's GraphQL query (src/data/github.ts).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Test the production build
        run: pnpm test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Setup Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
