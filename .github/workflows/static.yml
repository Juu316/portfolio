# Builds the site and deploys it to GitHub Pages.
#
# The build has no dependencies, so there is no `npm install` step and no
# lockfile to keep in sync — checkout to deployed is a few seconds.
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  # Lets you re-deploy by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, but let an in-flight one finish.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build site
        run: node build.js

      # Fails the deploy on a broken link, a missing SEO tag, an
      # inaccessible form field, or a render-blocking resource — so a
      # regression never reaches the live site.
      - name: Validate output
        run: node check.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
